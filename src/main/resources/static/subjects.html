<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Subjects | Student Attendance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content">
        <div class="page-header">
            <h1>Subjects</h1>
            <button class="btn btn-primary" id="addSubjectBtn">Add subject</button>
        </div>
        <div id="alertBox"></div>

        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead><tr><th>Subject ID</th><th>Subject name</th><th>Department</th><th>Semester</th><th>Actions</th></tr></thead>
                    <tbody id="subjectTableBody"><tr><td colspan="5" class="text-center text-muted py-4">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<!-- Add / Edit subject popup -->
<div class="modal fade" id="subjectModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <form class="modal-content" id="subjectForm" novalidate>
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Add subject</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="modalAlert"></div>
                <div class="mb-3">
                    <label for="subjectCode" class="form-label">Subject ID</label>
                    <input type="text" id="subjectCode" class="form-control" placeholder="CS305" maxlength="20">
                    <div class="invalid-feedback"></div>
                </div>
                <div class="mb-3">
                    <label for="subjectName" class="form-label">Subject name</label>
                    <input type="text" id="subjectName" class="form-control" maxlength="100">
                    <div class="invalid-feedback"></div>
                </div>
                <div class="row g-3">
                    <div class="col-6">
                        <label for="subjectDepartment" class="form-label">Department</label>
                        <select id="subjectDepartment" class="form-select"></select>
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="col-6">
                        <label for="subjectSemester" class="form-label">Semester</label>
                        <select id="subjectSemester" class="form-select"></select>
                        <div class="invalid-feedback"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary" id="saveSubjectBtn">Save subject</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/subjects.js"></script>
</body>
</html>
