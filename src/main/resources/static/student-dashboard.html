<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Attendance | Student Attendance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar student-nav navbar-dark">
    <div class="container-fluid px-4">
        <span class="navbar-brand mb-0 h1">Attendance Manager</span>
        <div class="d-flex align-items-center gap-3 text-white">
            <span>Welcome, <strong id="userName"></strong></span>
            <button class="btn btn-sm btn-outline-light" id="logoutBtn">Logout</button>
        </div>
    </div>
</nav>

<div class="student-container">
    <div id="alertBox"></div>

    <div class="row g-3 mb-4">
        <div class="col-lg-6">
            <div class="card h-100">
                <div class="card-header">My profile</div>
                <div class="card-body" id="profileBox">Loading...</div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card h-100">
                <div class="card-header">Overall attendance</div>
                <div class="card-body">
                    <div class="overall-percent" id="overallPercent">-</div>
                    <div class="text-muted mt-1 mb-3" id="overallText"></div>
                    <div class="progress" style="height: 10px;">
                        <div class="progress-bar" id="overallBar" role="progressbar" style="width: 0%"></div>
                    </div>
                    <div class="mt-3" id="warningBox"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header">Subject-wise attendance</div>
        <div class="table-responsive">
            <table class="table table-hover">
                <thead><tr><th>Subject</th><th>Total classes</th><th>Present</th><th>Absent</th><th>Percentage</th></tr></thead>
                <tbody id="subjectBody"></tbody>
            </table>
        </div>
    </div>

    <div class="card">
        <div class="card-header">Recent attendance records</div>
        <div class="table-responsive">
            <table class="table table-hover">
                <thead><tr><th>Date</th><th>Subject</th><th>Status</th></tr></thead>
                <tbody id="recentBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/student-dashboard.js"></script>
</body>
</html>
