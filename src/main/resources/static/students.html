<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Students | Student Attendance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content">
        <div class="page-header">
            <h1>Students</h1>
            <a href="add-student.html" class="btn btn-primary">Add student</a>
        </div>
        <div id="alertBox"></div>

        <div class="card">
            <div class="card-header">
                <form id="searchForm" class="row g-2 align-items-center">
                    <div class="col-12 col-md-6 col-lg-4">
                        <input type="search" id="searchInput" class="form-control" placeholder="Search by name, Student ID, email or department">
                    </div>
                    <div class="col-auto"><button class="btn btn-outline-primary" type="submit">Search</button></div>
                    <div class="col-auto ms-auto text-muted fw-normal" id="studentCount"></div>
                </form>
            </div>
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                    <tr><th>Student ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Department</th><th>Year</th><th>Section</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="studentTableBody"><tr><td colspan="8" class="text-center text-muted py-4">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/students.js"></script>
</body>
</html>
