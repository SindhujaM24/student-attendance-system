<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | Student Attendance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content">
        <div class="page-header">
            <h1>Dashboard</h1>
            <span class="user-chip">Signed in as <strong id="userName"></strong></span>
        </div>
        <div id="alertBox"></div>

        <div class="row g-3 mb-4">
            <div class="col-sm-6 col-xl-3">
                <div class="card stat-card"><div class="card-body">
                    <div class="stat-label">Total students</div>
                    <div class="stat-value" id="totalStudents">-</div>
                </div></div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="card stat-card"><div class="card-body">
                    <div class="stat-label">Total subjects</div>
                    <div class="stat-value" id="totalSubjects">-</div>
                </div></div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="card stat-card"><div class="card-body">
                    <div class="stat-label">Today's attendance</div>
                    <div class="stat-value" id="todayAttendance">-</div>
                    <div class="stat-note" id="todayNote"></div>
                </div></div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="card stat-card warn"><div class="card-body">
                    <div class="stat-label" id="lowLabel">Below attendance requirement</div>
                    <div class="stat-value" id="lowCount">-</div>
                    <div class="stat-note">Students with at least one low subject</div>
                </div></div>
            </div>
        </div>

        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>Low attendance students</span>
                <a href="attendance-report.html" class="btn btn-sm btn-outline-primary">Full report</a>
            </div>
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead><tr><th>Student</th><th>Subject</th><th>Present / Total</th><th>Attendance</th></tr></thead>
                    <tbody id="lowTableBody"><tr><td colspan="4" class="text-center text-muted py-4">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
