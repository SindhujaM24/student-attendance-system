<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Attendance | Student Attendance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content">
        <div class="page-header">
            <h1>Mark attendance</h1>
            <span class="user-chip">Signed in as <strong id="userName"></strong></span>
        </div>
        <div id="alertBox"></div>

        <div class="card mb-4">
            <div class="card-body">
                <form id="filterForm" class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label for="date" class="form-label">Date</label>
                        <input type="date" id="date" class="form-control">
                    </div>
                    <div class="col-md-4">
                        <label for="subject" class="form-label">Subject</label>
                        <select id="subject" class="form-select"></select>
                    </div>
                    <div class="col-6 col-md-2">
                        <label for="year" class="form-label">Year</label>
                        <select id="year" class="form-select"></select>
                    </div>
                    <div class="col-6 col-md-1">
                        <label for="section" class="form-label">Section</label>
                        <select id="section" class="form-select"></select>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Load students</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card d-none" id="sheetCard">
            <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
                <span id="sheetTitle">Attendance sheet</span>
                <span>
                    <button type="button" class="btn btn-sm btn-outline-success" id="allPresentBtn">All present</button>
                    <button type="button" class="btn btn-sm btn-outline-danger" id="allAbsentBtn">All absent</button>
                </span>
            </div>
            <div class="alert alert-info rounded-0 border-0 border-bottom mb-0 d-none" id="editNotice">
                Attendance was already saved for this class and date. Saving again will update it.
            </div>
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead><tr><th>Student ID</th><th>Student name</th><th>Status</th></tr></thead>
                    <tbody id="sheetBody"></tbody>
                </table>
            </div>
            <div class="card-footer bg-white d-flex flex-wrap justify-content-between align-items-center gap-2">
                <span class="text-muted" id="countText"></span>
                <button type="button" class="btn btn-primary" id="saveBtn">Save attendance</button>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/attendance.js"></script>
</body>
</html>
