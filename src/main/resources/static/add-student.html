<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Form | Student Attendance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content">
        <div class="page-header">
            <h1 id="formTitle">Add student</h1>
            <a href="students.html" class="btn btn-outline-primary">Back to students</a>
        </div>
        <div id="alertBox"></div>

        <div class="card" style="max-width: 760px;">
            <div class="card-body">
                <form id="studentForm" novalidate>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="studentCode" class="form-label">Student ID</label>
                            <input type="text" id="studentCode" class="form-control" placeholder="ST009" maxlength="20">
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="name" class="form-label">Full name</label>
                            <input type="text" id="name" class="form-control" maxlength="100">
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" placeholder="name@college.edu">
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="phone" class="form-label">Phone</label>
                            <input type="tel" id="phone" class="form-control" placeholder="10-digit mobile number" maxlength="10">
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-md-4">
                            <label for="department" class="form-label">Department</label>
                            <select id="department" class="form-select"></select>
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-md-4">
                            <label for="year" class="form-label">Year</label>
                            <select id="year" class="form-select"></select>
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-md-4">
                            <label for="section" class="form-label">Section</label>
                            <select id="section" class="form-select"></select>
                            <div class="invalid-feedback"></div>
                        </div>
                    </div>
                    <p class="text-muted small mt-3 mb-0" id="passwordNote">
                        A student login is created automatically: username = email, default password = <code>student123</code>.
                    </p>
                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary" id="submitBtn">Save student</button>
                        <a href="students.html" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/student-form.js"></script>
</body>
</html>
