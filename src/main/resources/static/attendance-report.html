<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Attendance Report | Student Attendance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content">
        <div class="page-header">
            <h1>Attendance report</h1>
            <button class="btn btn-outline-primary no-print" onclick="window.print()">Print report</button>
        </div>
        <div id="alertBox"></div>

        <div class="card mb-4">
            <div class="card-header">
                <div class="row g-2 align-items-center no-print">
                    <div class="col-md-4">
                        <select id="subjectFilter" class="form-select"></select>
                    </div>
                    <div class="col-md-4">
                        <input type="search" id="searchInput" class="form-control" placeholder="Search student name or ID">
                    </div>
                    <div class="col-md-4 text-md-end text-muted fw-normal" id="rowCount"></div>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                    <tr><th>Student ID</th><th>Student name</th><th>Subject</th><th>Total classes</th><th>Present</th><th>Absent</th><th>Attendance</th></tr>
                    </thead>
                    <tbody id="reportBody"><tr><td colspan="7" class="text-center text-muted py-4">Loading...</td></tr></tbody>
                </table>
            </div>
            <div class="card-footer bg-white text-muted small">Attendance % = Present / Total classes x 100</div>
        </div>

        <div class="card">
            <div class="card-header text-danger" id="lowTitle">Low attendance students</div>
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead><tr><th>Student</th><th>Subject</th><th>Present / Total</th><th>Attendance</th></tr></thead>
                    <tbody id="lowBody"><tr><td colspan="4" class="text-center text-muted py-4">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/report.js"></script>
</body>
</html>
