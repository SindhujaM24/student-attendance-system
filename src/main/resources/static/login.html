<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Student Attendance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="login-page">
    <div class="card login-card">
        <div class="card-body p-4">
            <h1 class="mb-1">Student Attendance System</h1>
            <p class="text-muted mb-4">Sign in to continue</p>

            <div id="alertBox"></div>

            <form id="loginForm" novalidate>
                <div class="btn-group w-100 mb-3" role="group" aria-label="Login type">
                    <input type="radio" class="btn-check" name="role" id="roleAdmin" value="ADMIN" checked>
                    <label class="btn btn-outline-primary" for="roleAdmin">Admin / Teacher</label>
                    <input type="radio" class="btn-check" name="role" id="roleStudent" value="STUDENT">
                    <label class="btn btn-outline-primary" for="roleStudent">Student</label>
                </div>

                <div class="mb-3">
                    <label for="username" class="form-label">Email / Username</label>
                    <input type="text" class="form-control" id="username" autocomplete="username" autofocus>
                    <div class="invalid-feedback">Enter your email or username</div>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" autocomplete="current-password">
                    <div class="invalid-feedback">Enter your password</div>
                </div>
                <button type="submit" class="btn btn-primary w-100" id="loginBtn">Login</button>
            </form>

            <div class="demo-box p-3 mt-4">
                <strong>Demo accounts</strong><br>
                Admin: <code>admin</code> / <code>admin123</code><br>
                Student: <code>arun.kumar@college.edu</code> / <code>student123</code>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/login.js"></script>
</body>
</html>
